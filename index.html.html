  <style>
:root {
  color-scheme: light;
  --ink: #292e25;
  --muted: #5e665b;
  --green: #314e3c;
  --green-dark: #243b2d;
  --sage: #dbe8d7;
  --paper: #f8f7f1;
  --white: #fffefa;
  --line: #e5e7dd;
  --sidebar: #f0f2e9;
  --peach: #f2d8ca;
  --pink: #f6e6de;
  --serif: "DM Serif Text", Georgia, serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img { display: block; max-width: 100%; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid #426a53; outline-offset: 3px; }
[hidden] { display: none !important; }
.skip { position: fixed; top: 8px; left: 8px; z-index: 30; background: var(--white); padding: 12px; transform: translateY(-150%); }
.skip:focus { transform: none; }
svg.icon { width: 19px; height: 19px; flex: 0 0 auto; vertical-align: middle; }
h1, h2, h3, p { margin: 0; }
p { line-height: 1.5; }
h1, .promo-title, .public-hero h1, .public-section h2 { font-family: var(--serif); font-weight: 500; letter-spacing: -.035em; }
h1 { font-size: clamp(35px, 3.15vw, 49px); line-height: 1.03; }
h2 { font-size: 20px; line-height: 1.22; letter-spacing: -.035em; }
h3 { font-size: 15px; line-height: 1.3; letter-spacing: -.015em; }
button { color: inherit; }
button:disabled { opacity: .65; cursor: default; }
.btn, .icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 41px; border: 1px solid transparent; border-radius: 9px;
  padding: 8px 14px; color: var(--ink); background: none; text-decoration: none;
  font-size: 13px; line-height: 1.2; font-weight: 690; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
.btn .icon { width: 17px; height: 17px; }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-dark); }
.btn-secondary { border-color: #dcded3; background: var(--white); }
.btn-secondary:hover { background: #edf1e9; border-color: #cad4c7; }
.btn-quiet { color: var(--green); padding-inline: 9px; }
.btn-quiet:hover { background: #edf2e9; }
.btn-small { min-height: 32px; font-size: 12px; padding: 5px 8px; }
.btn-danger { background: #784431; color: white; }
.btn-danger:hover { background: #643622; }
.icon-btn { min-width: 38px; padding: 7px; }
.icon-btn:hover { background: #e9ede3; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; text-align: left; }
.brand-logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
.brand-title { display: block; font-family: var(--serif); font-size: 19px; line-height: 1.02; color: #2c392e; letter-spacing: -.04em; }
.brand-sub { display: block; font-size: 11px; color: var(--muted); margin-top: 5px; }
.shell { display: grid; grid-template-columns: 226px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column;
  background: var(--sidebar); border-right: 1px solid #e2e6da; padding: 24px 15px 15px;
  overflow-y: auto;
}
.sidebar .brand { margin: 0 7px 31px; }
.nav-group + .nav-group { margin-top: 21px; }
.nav-label { padding-left: 12px; margin-bottom: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: #5c6759; font-weight: 760; }
.nav-link {
  display: flex; align-items: center; gap: 11px; text-decoration: none;
  min-height: 41px; margin-bottom: 3px; border-radius: 9px; padding: 8px 12px;
  color: #465244; font-size: 13px; line-height: 1.15; font-weight: 570;
}
.nav-link .icon { width: 17px; height: 17px; }
.nav-link:hover { background: #e7ede0; }
.nav-link[aria-current="page"] { color: #274631; background: #dce8d7; font-weight: 740; }
.nav-link[aria-current="page"] .icon { stroke-width: 2.1; }
.sidebar-foot { margin-top: auto; padding: 14px 5px 0; }
.sidebar-note { border-top: 1px solid #dce2d5; padding: 14px 6px 2px; }
.demo-label { display: inline-flex; align-items: center; gap: 7px; color: #4d5d4d; font-size: 11px; font-weight: 660; }
.demo-label::before { content: ""; width: 7px; height: 7px; background: #648364; border-radius: 50%; }
.sidebar-foot .btn { margin: 5px 0 0 -6px; justify-content: flex-start; }
.main-shell { min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 65px; padding: 10px clamp(18px, 3vw, 40px); border-bottom: 1px solid var(--line);
  background: #fafaf4;
}
.topbar-title { color: #4b594a; font-weight: 660; font-size: 13px; display: inline-flex; align-items: center; gap: 9px; }
.topbar-title .icon { width: 16px; height: 16px; }
.topbar-actions { display: flex; align-items: center; gap: 13px; }
.topbar-actions .btn-secondary { min-height: 36px; padding-inline: 12px; }
.mobile-menu { display: none; }
.workspace { max-width: 1510px; padding: 28px clamp(18px, 3vw, 40px) 32px; margin-inline: auto; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 22px; }
.page-head p { color: var(--muted); font-size: 14px; margin-top: 7px; }
.page-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
.today { display: flex; align-items: center; gap: 7px; }
.today .icon { width: 15px; height: 15px; }
.promo {
  position: relative; isolation: isolate; display: flex; align-items: center; min-height: 196px;
  overflow: hidden; border-radius: 17px; background: #f3e0d7; border: 1px solid #efdbd1;
}
.promo-copy { padding: 24px 30px; position: relative; z-index: 2; max-width: 66%; }
.promo-overline { display: inline-flex; gap: 6px; align-items: center; font-size: 10px; color: #703f2d; font-weight: 810; letter-spacing: .1em; text-transform: uppercase; }
.promo-overline .icon { width: 14px; height: 14px; }
.promo-title { margin: 5px 0 5px; color: #422d25; font-size: clamp(31px, 3.26vw, 48px); line-height: 1; }
.promo-copy p { max-width: 285px; font-size: 14px; color: #604437; }
.promo-copy .btn { min-height: 32px; padding-left: 0; margin-top: 8px; color: #663d2d; }
.promo-copy .btn:hover { background: transparent; text-decoration: underline; }
.promo-visual { position: absolute; inset: 0 0 0 40%; z-index: -1; overflow: hidden; }
.promo-visual::before { content: ""; position: absolute; width: min(77%, 430px); aspect-ratio: 1; right: 3%; top: 12px; border-radius: 50%; background: #eac4b0; }

function loadState() {

    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && Object.keys(seed()).every(key => Array.isArray(saved[key]))) return saved;
  } catch {
    // The prototype remains usable if the browser disables storage.
  }
  return seed();
}

  const input = type === "select" ? `<select id="${fieldId}" name="${name}"${flags}>${fallback}</select>`
    : type === "textarea" ? `<textarea id="${fieldId}" name="${name}" placeholder="${esc(placeholder)}"${flags} maxlength="250">${esc(value)}</textarea>`
    : `<input id="${fieldId}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${constraint}${flags} autocomplete="off">`;
  return `<div class="field"><label for="${fieldId}">${label}</label>${input}${help ? `<small>${help}</small>` : ""}</div>`;
}
function row(...fields) { return '<div class="form-row">' + fields.join("") + "</div>"; }
function modal(title, content) {
  dialogReturnFocus = document.activeElement;
  dialog.innerHTML = `<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button type="button" class="icon-btn" data-dialog-close aria-label="Cerrar">${icon("X")}</button></div><div class="dialog-content">${content}</div>`;
  if (!dialog.open) dialog.showModal();
}
function modalForm(title, fields, button, onSubmit, options = {}) {
  modal(title, `<form><div class="form-stack">${fields}
    <p class="form-error" role="alert" hidden></p>
    <div class="form-foot"><button type="button" class="btn btn-quiet" data-dialog-close>Cerrar</button><button class="btn btn-${options.danger ? "danger" : "primary"}" type="submit">${button}</button></div>
    </div></form>`);
  const form = dialog.querySelector("form");
  form.addEventListener("submit", event => {
    event.preventDefault();
    const error = form.querySelector(".form-error");
    error.hidden = true;
    const values = Object.fromEntries(Array.from(new FormData(form), ([key, value]) => [key, value.trim()]));
    const missing = Array.from(form.elements).find(input => input.required && !values[input.name]);
    const problem = missing ? "Completa «" + missing.labels[0].textContent + "»." : onSubmit(values);
    if (typeof problem === "string") {
      error.textContent = problem;
      error.hidden = false;
      missing?.focus();
      return;
    }
    dialog.close();
    if (problem?.route) {
      go(problem.route);
    } else {
      render();
      if (problem?.focus) document.querySelector(problem.focus)?.focus();
      else document.querySelector("#page-title")?.focus({ preventScroll: true });
    }
  });
  return form;
}
function configureBooking(form, getRate) {
  const date = form.elements.date;
  const slot = form.elements.time;
  const price = form.querySelector("#price-preview");
  function updateSlots() {
    const previous = slot.value;
    const possible = slots.filter(time => !blocked(date.value, time));
    const desired = possible.includes(previous) ? previous : possible.includes("13:00") ? "13:00" : possible[0];
    slot.innerHTML = possible.length ? slots.map(time => {
      const busy = !possible.includes(time);
      return `<option value="${time}"${busy ? " disabled" : ""}${time === desired ? " selected" : ""}>${time}${busy ? " · ocupado" : ""}</option>`;
    }).join("") : '<option value="">Sin horarios disponibles</option>';
    updatePrice();
  }
  function updatePrice() {
    if (!date.value) { price.textContent = "Elige la fecha para consultar el precio."; return; }
    const rate = getRate(date.value);
    price.textContent = "Total del baño " + money(rate.total) + " MXN" + (rate.discount ? " · 40% de descuento del lunes" : "");
  }
  date.addEventListener("change", updateSlots);
  form.addEventListener("change", updatePrice);
  updateSlots();
}
function validateBooking(date, time) {
  if (!date || date < DEMO_DAY || !slots.includes(time)) return "Selecciona una fecha y un horario válidos.";
  if (blocked(date, time)) return "Ese horario ya está ocupado. Selecciona otro.";
  return "";
}
function book() {
  if (!state.pets.length) {
    modal("Agendar cita", '<p>Registra primero una mascota y su responsable.</p>' + link("mascotas", "Abrir mascotas", "primary"));
    return;
  }
  const pets = state.pets.map(pet => [pet.id, pet.name + " · " + (clientFor(pet)?.name || "")]);
  const date = ui.agendaDate < DEMO_DAY ? DEMO_DAY : ui.agendaDate;
  const fields = field("pet", "Mascota y responsable", "m4", { type: "select", options: pets }) +
    row(field("date", "Fecha", date, { type: "date", min: DEMO_DAY, max: "2099-12-31" }), field("time", "Hora", "", { type: "select", options: [] })) +
    '<div class="notice" id="price-preview" aria-live="polite"></div>';
  const form = modalForm("Agendar cita", fields, "Guardar cita", values => {
    const problem = validateBooking(values.date, values.time);
    if (problem) return problem;
    const pet = byId(state.pets, values.pet);
    if (!pet) return "Selecciona una mascota del registro.";
    const { total, discount } = bathroomRate(pet.size, values.date);
    state.appointments.push({ id: id(), petId: pet.id, date: values.date, time: values.time, status: "confirmed", total, discount });
    ui.agendaDate = values.date;
    save("Cita confirmada para " + pet.name + " a las " + values.time + ".");
    return { route: "agenda" };
  });
  configureBooking(form, date => bathroomRate(byId(state.pets, form.elements.pet.value)?.size, date));
}
function publicBook() {
  const fields = '<p class="note">Usa datos ficticios para probar la solicitud.</p>' +
    row(field("pet", "Nombre de tu mascota"), field("size", "Tamaño de raza", "Mediana", { type: "select", options: SIZES.map(size => [size, size]) })) +
    row(field("owner", "Tu nombre"), field("phone", "Teléfono", "", { type: "tel", required: false })) +
    row(field("date", "Fecha", DEMO_DAY, { type: "date", min: DEMO_DAY, max: "2099-12-31" }), field("time", "Hora", "", { type: "select", options: [] })) +
    '<div class="notice notice-pink" id="price-preview" aria-live="polite"></div>' +
    '<div><button class="btn btn-quiet btn-small" type="button" id="fill-example">Usar datos de ejemplo</button></div>';
  const form = modalForm("Solicitar cita", fields, "Enviar solicitud", values => {
    const problem = validateBooking(values.date, values.time);
    if (problem) return problem;
    let owner = state.clients.find(client => normalized(client.name) === normalized(values.owner) && normalized(client.phone) === normalized(values.phone));
    if (!owner) {
      owner = { id: id(), name: values.owner, phone: values.phone };
      state.clients.push(owner);
    }
    let pet = state.pets.find(item => item.clientId === owner.id && normalized(item.name) === normalized(values.pet) && item.size === values.size);
    if (!pet) {
      pet = { id: id(), name: values.pet, breed: "", size: values.size, traits: "", condition: "", clientId: owner.id };
      state.pets.push(pet);
    }
    const { total, discount } = bathroomRate(pet.size, values.date);
    state.appointments.push({ id: id(), petId: pet.id, date: values.date, time: values.time, status: "pending", total, discount });
    ui.agendaDate = values.date;
    save("Solicitud de ejemplo registrada. Quedó por confirmar.");
    return { focus: "#page-title" };
  });
  form.querySelector("#fill-example").addEventListener("click", () => {
    form.elements.pet.value = "Bimba";
    form.elements.owner.value = "Sofía Ríos";
    form.elements.phone.value = "477 000 0107";
  });
  configureBooking(form, date => bathroomRate(form.elements.size.value, date));
}
function approve(appointment) {
  if (!appointment || appointment.status !== "pending") return;
  appointment.status = "confirmed";
  save("Solicitud confirmada. La cita ya aparece en la agenda.");
  render();
  document.querySelector("#page-title")?.focus({ preventScroll: true });
}
function finishAppointment(appointment) {
  if (!appointment || appointment.status !== "confirmed") return;
  const pet = byId(state.pets, appointment.petId);
  modalForm("Completar y cobrar", `<p class="note">Baño de ${esc(pet?.name)}, a las ${appointment.time}. Se registrará una venta de <strong>${money(appointment.total)} MXN</strong>.</p>`, "Registrar atención", () => {
    if (appointment.status !== "confirmed" || state.sales.some(sale => sale.appointmentId === appointment.id)) return "Esta cita ya tiene una venta registrada.";
    appointment.status = "done";
    state.sales.push({ id: id(), date: appointment.date, time: appointment.time, kind: "Baño", label: "Baño de " + pet.name, quantity: 1, total: appointment.total, appointmentId: appointment.id });
    save("Cita atendida. Se registraron " + money(appointment.total) + " MXN en ventas.");
  });
}
function cancelAppointment(appointment) {
  if (!appointment || !["pending", "confirmed"].includes(appointment.status)) return;
  const pet = byId(state.pets, appointment.petId);
  modalForm("Cancelar cita", `<p class="note">La cita de ${esc(pet?.name)} a las ${appointment.time} quedará cancelada y se liberará el horario.</p>`, "Cancelar cita", () => {
    appointment.status = "cancelled";
    save("Cita cancelada. El horario volvió a estar disponible.");
  }, { danger: true });
}
function saleForm() {
  const inStock = state.products.filter(item => item.stock > 0);
  if (!inStock.length) {
    modal("Nueva venta", '<p>Registra una entrada de inventario antes de capturar una venta.</p>' + link("inventario", "Abrir inventario", "primary"));
    return;
  }
  const fields = '<p class="note">Venta de producto para el ' + longDate(DEMO_DAY).toLowerCase() + '.</p>' +
    field("product", "Producto", inStock[0].id, { type: "select", options: inStock.map(item => [item.id, item.name + " · " + money(item.price)]) }) +
    field("quantity", "Unidades", "1", { type: "number", min: 1, step: 1 }) + '<div class="notice" id="sale-total" aria-live="polite"></div>';
  const form = modalForm("Nueva venta", fields, "Registrar venta", values => {
    const product = byId(state.products, values.product);
    const quantity = Number(values.quantity);
    if (!product || quantity > product.stock || !Number.isInteger(quantity) || quantity < 1) return "La cantidad debe estar dentro de las existencias disponibles.";
    const total = discounted(product.price * quantity, 0);
    const time = new Intl.DateTimeFormat("es-MX", { timeZone: "America/Mexico_City", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date());
    product.stock -= quantity;
    state.sales.push({ id: id(), date: DEMO_DAY, time, kind: "Producto", label: product.name, quantity, total });
    ui.salesDate = DEMO_DAY;
    save("Venta de " + money(total) + " MXN registrada. Inventario actualizado.");
  });
  const quantity = form.elements.quantity;
  function updateTotal() {
    const product = byId(inStock, form.elements.product.value);
    quantity.max = product.stock;
    const units = Number(quantity.value);
    form.querySelector("#sale-total").textContent = "Total " + money(discounted(product.price * units, 0)) + " MXN · " + product.stock + " pzas. disponibles";
  }
  form.addEventListener("input", updateTotal);
  updateTotal();
}
function upsert(collection, existing, values) {
  if (existing) Object.assign(existing, values);
  else state[collection].push({ id: id(), ...values });
}
function productForm(product) {
  const fields = field("name", "Nombre", product?.name) +
    field("description", "Descripción", product?.description, { type: "textarea" }) +
    row(field("category", "Categoría", product?.category), field("price", "Precio (MXN)", product?.price, { type: "number", min: 0, max: 999999, step: 0.01 })) +
    row(field("stock", "Unidades en existencia", product?.stock ?? 0, { type: "number", min: 0, max: 999999, step: 1 }), field("minimum", "Mínimo para reposición", product?.minimum ?? 5, { type: "number", min: 0, max: 999999, step: 1 }));
  modalForm(product ? "Editar producto" : "Nuevo producto", fields, "Guardar producto", values => {
    const { name, description, category } = values;
    upsert("products", product, { name, description, category, stock: Number(values.stock), minimum: Number(values.minimum), price: Number(values.price), icon: product?.icon || "Package" });
    save(product ? "Producto actualizado." : "Producto añadido al inventario.");
  });
}
function restock(product) {
  if (!product) return;
  const fields = `<p class="note">${esc(product.name)} tiene ${product.stock} pzas. en existencia.</p>` +
    field("quantity", "Unidades recibidas", 1, { type: "number", min: 1, max: 999999 - product.stock, step: 1 });
  modalForm("Entrada de inventario", fields, "Sumar a existencias", values => {
    product.stock += Number(values.quantity);
    save("Entrada registrada. Existencia actual: " + product.stock + " pzas.");
  });
}
function petForm(pet) {
  if (!state.clients.length) {
    modal("Nueva mascota", '<p>Registra primero a la persona responsable.</p>' + link("clientes", "Abrir clientes", "primary"));
    return;
  }
  const owners = state.clients.map(item => [item.id, item.name]);
  const fields = row(field("name", "Nombre", pet?.name), field("breed", "Raza", pet?.breed)) +
    row(field("size", "Tamaño de raza", pet?.size ?? "Mediana", { type: "select", options: SIZES.map(size => [size, size]) }),
      field("clientId", "Responsable", pet?.clientId ?? owners[0][0], { type: "select", options: owners })) +
    field("traits", "Características", pet?.traits, { type: "textarea" }) +
    field("condition", "Padecimiento o cuidado", pet?.condition, { type: "textarea", required: false });
  modalForm(pet ? "Editar mascota" : "Nueva mascota", fields, "Guardar ficha", values => {
    upsert("pets", pet, values);
    save("Ficha de mascota guardada.");
  });
}
function clientForm(client) {
  const fields = field("name", "Nombre del responsable", client?.name) +
    field("phone", "Teléfono", client?.phone, { type: "tel" });
  modalForm(client ? "Editar cliente" : "Nuevo cliente", fields, "Guardar cliente", values => {
    upsert("clients", client, values);
    save("Responsable guardado.");
  });
}
function providerForm(provider) {
  const fields = field("name", "Nombre o razón social", provider?.name) +
    field("goods", "Productos que suministra", provider?.goods, { type: "textarea" }) +
    row(field("phone", "Teléfono", provider?.phone, { type: "tel" }), field("email", "Correo", provider?.email, { type: "email", required: false }));
  modalForm(provider ? "Editar proveedor" : "Nuevo proveedor", fields, "Guardar proveedor", values => {
    upsert("providers", provider, values);
    save("Proveedor guardado.");
  });
}
function serviceForm(service) {
  const fields = service?.size ? `<p class="note">${esc(service.name)}</p>` : field("name", "Nombre del servicio", service?.name);
  modalForm(service ? "Editar servicio" : "Nuevo servicio", fields +
    field("description", "Descripción", service?.description, { type: "textarea" }) +
    field("price", "Precio (MXN)", service?.price, { type: "number", min: 0, max: 999999, step: 0.01 }), "Guardar servicio", values => {
    const name = service?.size ? service.name : values.name;
    upsert("services", service, { name, description: values.description, price: Number(values.price) });
    save("Servicio actualizado.");
  });
}
function resetDemo() {
  modalForm("Reiniciar demo", '<p class="note">Se restaurarán los productos, citas y ventas de ejemplo. Los cambios hechos en este navegador se borrarán.</p>', "Restaurar datos de ejemplo", () => {
    state = seed();
    Object.assign(ui, { agendaDate: DEMO_DAY, salesDate: DEMO_DAY, reportDate: DEMO_DAY, stockFilter: "all", query: "", menuOpen: false });
    save("La demostración volvió a sus datos iniciales.");
    return { route: "inicio" };
  }, { danger: true });
}
function updateList() {
  const list = document.querySelector("#module-list");
  if (list) list.innerHTML = activeRoute === "inventario" ? inventoryList() : directoryList(activeRoute);
}
function filterStock(key) {
  ui.stockFilter = key;
  app.querySelectorAll("[data-action=stock-filter]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.key === key)));
  updateList();
}
function go(route) {
  if (location.hash === "#" + route) readRoute(true);
  else location.hash = route;
}
function setAgendaDate(date) {
  ui.agendaDate = date;
  render();
  document.querySelector("#agenda-date")?.focus();
}
function moveReportWeek(days) {
  ui.reportDate = moveDate(ui.reportDate, days);
  render();
  document.querySelector(days < 0 ? "[data-action=prev-week]" : "[data-action=next-week]")?.focus();
}
function toggleMenu(open) {
  ui.menuOpen = open;
  app.querySelector(".sidebar")?.classList.toggle("is-open", open);
  const cover = app.querySelector(".menu-cover");
  const menuButton = app.querySelector(".mobile-menu");
  if (cover) cover.hidden = !open;
  menuButton?.setAttribute("aria-expanded", String(open));
  if (open) app.querySelector(".sidebar .nav-link")?.focus();
  else menuButton?.focus();
}
const actions = {
  book, "public-book": publicBook, sale: saleForm, reset: resetDemo,
  "new-product": () => productForm(), "edit-product": key => productForm(byId(state.products, key)),
  restock: key => restock(byId(state.products, key)),
  "new-pet": () => petForm(), "edit-pet": key => petForm(byId(state.pets, key)),
  "new-client": () => clientForm(), "edit-client": key => clientForm(byId(state.clients, key)),
  "new-provider": () => providerForm(), "edit-provider": key => providerForm(byId(state.providers, key)),
  "new-service": () => serviceForm(), "edit-service": key => serviceForm(byId(state.services, key)),
  approve: key => approve(byId(state.appointments, key)),
  "finish-appointment": key => finishAppointment(byId(state.appointments, key)),
  "cancel-appointment": key => cancelAppointment(byId(state.appointments, key)),
  "agenda-today": () => setAgendaDate(DEMO_DAY), "go-pending": setAgendaDate,
  "prev-week": () => moveReportWeek(-7), "next-week": () => moveReportWeek(7), "stock-filter": filterStock,
  "scroll-services": () => document.querySelector("#precios")?.scrollIntoView({ behavior: "auto" }),
  menu: () => toggleMenu(true), "close-menu": () => toggleMenu(false),
};
app.addEventListener("click", event => {
  const target = event.target.closest("[data-action]");
  if (target) {
    actions[target.dataset.action]?.(target.dataset.key);
    return;
  }
  const anchor = event.target.closest("a[href^='#']");
  if (anchor && anchor.hash === location.hash && ui.menuOpen) toggleMenu(false);
});
app.addEventListener("change", event => {
  const input = event.target;
  if (input.type !== "date" || !input.value || !input.validity.valid) return;
  const fieldKey = { "agenda-date": "agendaDate", "sales-date": "salesDate", "report-date": "reportDate" }[input.id];
  if (!fieldKey) return;
  ui[fieldKey] = input.value;
  render();
  document.getElementById(input.id)?.focus();
});
app.addEventListener("input", event => {
  if (event.target.id !== "module-search") return;
  ui.query = event.target.value;
  updateList();
});
dialog.addEventListener("click", event => {
  if (event.target.closest("[data-dialog-close]")) dialog.close();
});
dialog.addEventListener("close", () => {
  if (dialogReturnFocus?.isConnected) dialogReturnFocus.focus();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && ui.menuOpen && !dialog.open) toggleMenu(false);
});
document.querySelector(".skip").addEventListener("click", event => {
  event.preventDefault();
  document.querySelector("#contenido")?.focus();
});
window.addEventListener("hashchange", () => readRoute(true));
window.addEventListener("storage", event => {
  if (event.key !== STORAGE_KEY) return;
  state = loadState();
  if (dialog.open) dialog.close();
  render();
});
readRoute();

  </script>
